<!doctype html>
<!--
recipe: stock-shot 第三方照片/视频空镜 + 关键词
满幅图库照片或视频，慢速 Ken Burns；一侧压暗，宋体关键词逐字写入，细线画出，等宽出处小字。
图库素材还没到时（mediaFallback[0]），自动改成"冲印照片"占位：实物 PNG 放在相纸上、胶带固定、标注 STOCK SLOT。
spec: { title:{text,at,side:"left"|"right"}, sub:{text,at}, credit, kb:{from:{s,x,y},to:{s,x,y}}, phLabel }
media m0: 图库照片/视频（或占位实物）
frame:"print" 把素材放进冲印相纸（720p 视频不满幅放大时用）。
-->
<html><head><meta charset="UTF-8" /></head><body><template>
<style>
.r-stock .bleed { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden; background:#121214; }
.r-stock .kb { position:absolute; inset:0; }
.r-stock .kb > img, .r-stock .kb > video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.r-stock .scrim { position:absolute; inset:0; }
.r-stock .t { position:absolute; font-family:var(--f-song); font-weight:900; font-size:176px; line-height:1; white-space:nowrap; }
.r-stock .rule { position:absolute; height:3px; width:260px; transform-origin:0 50%; }
.r-stock .sub { position:absolute; font-family:var(--f-mono); font-size:28px; letter-spacing:.1em; white-space:nowrap; }
.r-stock .on-photo .t, .r-stock .on-photo .sub { color:#F4EFE6; text-shadow:0 2px 24px rgba(0,0,0,.35); }
.r-stock .on-photo .rule { background:#F2CF3E; }
.r-stock .print { position:absolute; background:#F7F4EE; padding:26px 26px 84px; box-shadow:0 1px 2px rgba(0,0,0,.2), 0 30px 60px -16px rgba(0,0,0,.5); }
.r-stock .print .img { position:relative; width:100%; height:100%; overflow:hidden; background: radial-gradient(120% 100% at 30% 20%, #e9e3d6, #cfc5b2); }
.r-stock .print .img img { position:absolute; inset:6%; width:88%; height:88%; object-fit:contain; filter: drop-shadow(0 18px 24px rgba(0,0,0,.35)); }
.r-stock .print .cap { position:absolute; left:28px; bottom:26px; font-family:var(--f-mono); font-size:28px; color:#5a5248; letter-spacing:.08em; }
.r-stock .on-stage .t { color:var(--ink); } .r-stock .on-stage .sub { color:var(--sub); } .r-stock .on-stage .rule { background:var(--stamp); }
</style>
<div id="__SID__-root" data-composition-id="__SID__" data-width="1920" data-height="1080">
  <div id="__SID__-holder">__MEDIA__</div>
  <script type="application/json" id="__SID__-spec">__SPEC__</script>
</div>
<script>
(function () {
var Y = YF, c = Y.ctx("__SID__", document.querySelector('[data-composition-id="__SID__"]')), s = c.spec, tl = c.tl, W = 1920, H = 1080;
  c.root.classList.add("r-stock");
  var ph = s.mediaFallback && s.mediaFallback[0], framed = ph || s.frame === "print", m0 = c.m(0), side = (s.title && s.title.side) || "left";
  var layer = Y.el("div", framed ? "on-stage" : "on-photo", c.root); Y.css(layer, { position: "absolute", inset: 0, zIndex: 30 });
  if (!framed) {
    var bleed = Y.el("div", "bleed", c.cam), kb = Y.el("div", "kb", bleed); kb.appendChild(m0);
    var a = (s.kb && s.kb.from) || { s: 1.06, x: -24, y: 6 }, b = (s.kb && s.kb.to) || { s: 1.16, x: 24, y: -12 };
    tl.fromTo(kb, { scale: a.s, x: a.x, y: a.y }, { scale: b.s, x: b.x, y: b.y, duration: c.dur, ease: "none" }, 0);
    var sc = Y.el("div", "scrim", bleed);
    sc.style.background = side === "left"
      ? "radial-gradient(90% 120% at 0% 60%, rgba(12,10,8,.70) 0%, rgba(12,10,8,.28) 55%, rgba(12,10,8,0) 80%), radial-gradient(140% 80% at 50% 120%, rgba(0,0,0,.35), transparent 60%)"
      : "radial-gradient(90% 120% at 100% 60%, rgba(12,10,8,.70) 0%, rgba(12,10,8,.28) 55%, rgba(12,10,8,0) 80%), radial-gradient(140% 80% at 50% 120%, rgba(0,0,0,.35), transparent 60%)";
    tl.fromTo(bleed, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "sine.out" }, 0);
  } else {
    Y.stage(c);
    var pr = Y.el("div", "print", c.cam), box = side === "left" ? { x: ph ? 860 : 920, y: ph ? 120 : 190, w: ph ? 900 : 860, h: ph ? 700 : 484 } : { x: 160, y: ph ? 120 : 190, w: ph ? 900 : 860, h: ph ? 700 : 484 };
    Y.css(pr, { left: box.x, top: box.y, width: box.w, height: box.h + 84 });
    var im = Y.el("div", "img", pr); im.appendChild(m0);
    Y.el("div", "cap", pr, s.credit || "");
    Y.tape(pr, box.w / 2 - 80, -22, -3, 160);
    Y.drop(tl, pr, 0.05, { rot: side === "left" ? 2.2 : -2.2, y: -80 });
    tl.fromTo(m0, { scale: 1.0 }, { scale: 1.06, duration: c.dur, ease: "none", transformOrigin: "50% 60%" }, 0);
  }
  if (s.title) {
    var t = Y.el("div", "t", layer), ta = c.at(s.title.at, 0.4);
    var y = 430;
    if (side === "left") Y.css(t, { left: 150, top: y }); else { t.style.right = "150px"; t.style.top = y + "px"; t.style.textAlign = "right"; }
    Y.write(tl, t, s.title.text, ta);
    var r = Y.el("div", "rule", layer); if (side === "left") Y.css(r, { left: 154, top: y + 210 }); else { r.style.right = "154px"; r.style.top = (y + 210) + "px"; r.style.transformOrigin = "100% 50%"; }
    tl.fromTo(r, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, ta + 0.45);
    if (s.sub) { var sb = Y.el("div", "sub", layer, s.sub.text); if (side === "left") Y.css(sb, { left: 154, top: y + 240 }); else { sb.style.right = "154px"; sb.style.top = (y + 240) + "px"; } Y.fadeUp(tl, sb, c.at(s.sub.at, ta + 0.7), { y: 10 }); }
  }
  Y.hud(c, { onMedia: !framed });
  Y.finish(c);
})();
</script>
</template></body></html>
