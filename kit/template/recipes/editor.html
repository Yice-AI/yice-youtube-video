<!doctype html>
<!--
recipe: editor 代码窗口（"画面是写代码剪出来的"）
深色编辑器窗口放在桌面上，逐行打出这一期真实的 HyperFrames 代码；某一行被荧光标出，镜头推进到这一行；关键词纸签压在窗口上。
spec: { file, lines:[string], hl:{line,at}, at, win:{x,y,w,h}, title:{text,at,side,sub} }
-->
<html><head><meta charset="UTF-8" /></head><body><template>
<style>
.r-ed .win { position:absolute; background:#1B1D21; border-radius:14px; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 2px 4px rgba(0,0,0,.3), 0 40px 80px -20px rgba(0,0,0,.65); }
.r-ed .tb { height:50px; display:flex; align-items:center; gap:10px; padding:0 18px; background:#24262B; border-bottom:1px solid #2F3237; }
.r-ed .tb i { width:13px; height:13px; border-radius:50%; display:block; }
.r-ed .tb .fn { margin-left:18px; font-family:var(--f-mono); font-size:28px; color:#9AA0A8; letter-spacing:.04em; }
.r-ed .code { position:relative; padding:24px 0; font-family:var(--f-mono); font-size:28px; line-height:46px; color:#D7DAE0; }
.r-ed .ln { position:relative; display:flex; white-space:pre; height:46px; }
.r-ed .ln .g { width:76px; flex:none; text-align:right; padding-right:26px; color:#5C6370; }
.r-ed .ln .hlbar { position:absolute; left:0; right:0; top:0; bottom:0; background:rgba(242,207,62,.20); border-left:4px solid #F2CF3E; transform-origin:0 50%; }
.r-ed .k { color:#C792EA; } .r-ed .a { color:#F2CF3E; } .r-ed .v { color:#9CD58A; } .r-ed .t { color:#7FB6FF; } .r-ed .cm { color:#6B7280; }
</style>
<div id="__SID__-root" data-composition-id="__SID__" data-width="1920" data-height="1080">
  <div id="__SID__-holder">__MEDIA__</div>
  <script type="application/json" id="__SID__-spec">__SPEC__</script>
</div>
<script>
(function () {
var Y = YF, c = Y.ctx("__SID__", document.querySelector('[data-composition-id="__SID__"]')), s = c.spec, tl = c.tl, W = 1920, H = 1080;
  c.root.classList.add("r-ed");
  Y.stage(c);
  var wb = s.win || { x: 220, y: 110, w: 1480, h: 860 };
  var win = Y.el("div", "win", c.cam); Y.css(win, { left: wb.x, top: wb.y, width: wb.w, height: wb.h });
  var tb = Y.el("div", "tb", win); ["#ED6A5E", "#F5BF4F", "#61C554"].forEach(function (col) { var i = Y.el("i", "", tb); i.style.background = col; });
  Y.el("div", "fn", tb, s.file || "index.html");
  var code = Y.el("div", "code", win);
  function hi(line) {
    var h = line.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    h = h.replace(/([\w-]+)=(&quot;|")([^"]*)"/g, '<span class="a">$1</span>=<span class="v">"$3"</span>').replace(/(&lt;\/?)([a-z]+)/g, '$1<span class="t">$2</span>').replace(/(\/\/.*)$/, '<span class="cm">$1</span>');
    return h;
  }
  var t0 = c.at(s.at, 0.3), per = Math.min(0.22, (c.dur * 0.55) / Math.max(1, (s.lines || []).length));
  tl.fromTo(win, { opacity: 0, y: 40, rotation: -1.5 }, { opacity: 1, y: 0, rotation: -0.6, duration: 0.6, ease: "power3.out" }, 0);
  var hlEl = null;
  (s.lines || []).forEach(function (ln, i) {
    var row = Y.el("div", "ln", code);
    if (s.hl && s.hl.line === i) { hlEl = Y.el("div", "hlbar", row); }
    Y.el("span", "g", row, String(i + 1)); var tx = Y.el("span", "", row, hi(ln));
    tl.fromTo(row, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.18, ease: "power1.out" }, t0 + i * per);
  });
  var keys = [{ at: 0, x: 960, y: 540, s: 1 }];
  if (hlEl) { var ht = c.at(s.hl.at, t0 + 1.2); tl.fromTo(hlEl, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, ht); keys.push({ at: ht - 0.2, x: wb.x + wb.w * 0.42, y: wb.y + 74 + 24 + s.hl.line * 46, s: 1.45, d: 1.1 }); }
  Y.camera(c, keys);
  if (s.title) Y.label(c, s.title);
  Y.hud(c);
  Y.finish(c);
})();
</script>
</template></body></html>
